name: Health check

# A failed run emails whoever last changed this schedule, which is how an
# outage on the home server gets noticed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors https://zfit.ztkweb.com/api/health
